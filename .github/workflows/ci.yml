name: CI

on:
  push:
  pull_request:

jobs:
  seguridad-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Auditoria de dependencias
        run: npm audit --audit-level=critical
